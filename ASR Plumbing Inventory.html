<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ASR Plumbing Inventory</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: sticky header (location switch, big search, category chips), compact result rows that expand into one-tap stock buttons, fixed bottom tabs. Brass accent; stock colors are semantic. */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --surface-2:#F5F7F9; --ink:#14202B; --muted:#56626F; --line:#D3DAE1;
  --accent:#8F5F00; --accent-bg:#F6E7C4; --accent-ink:#FFFFFF; --focus:#1D5FD1; --scrim:rgba(10,18,26,.5);
  --extra:#1E5DBA; --extra-ink:#FFFFFF; --stocked:#1B7337; --stocked-ink:#FFFFFF; --half:#F0C232; --half-ink:#2B2000;
  --low:#C15209; --low-ink:#FFFFFF; --out:#B0241C; --out-ink:#FFFFFF; --flag:#B57A00; --warn-bg:#FFF2D6; --warn-ink:#6B4600;
  --ok:#1B7337; --danger:#B0241C;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif; --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px; --nav-h:62px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F151B; --surface:#18212A; --surface-2:#1E2933; --ink:#E7EDF2; --muted:#9AA8B5; --line:#2C3946;
  --accent:#E2AE48; --accent-bg:#3A2E14; --accent-ink:#1A1300; --focus:#7FB0FF; --scrim:rgba(0,0,0,.62);
  --extra:#5B95F0; --extra-ink:#08162B; --stocked:#45B86A; --stocked-ink:#04190B; --half:#F2CA4B; --half-ink:#241B00;
  --low:#F08A3C; --low-ink:#2A1100; --out:#F06B60; --out-ink:#2A0603; --flag:#F2BE4A; --warn-bg:#3A2E14; --warn-ink:#F5D79A;
  --ok:#45B86A; --danger:#F06B60; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F151B; --surface:#18212A; --surface-2:#1E2933; --ink:#E7EDF2; --muted:#9AA8B5; --line:#2C3946;
  --accent:#E2AE48; --accent-bg:#3A2E14; --accent-ink:#1A1300; --focus:#7FB0FF; --scrim:rgba(0,0,0,.62);
  --extra:#5B95F0; --extra-ink:#08162B; --stocked:#45B86A; --stocked-ink:#04190B; --half:#F2CA4B; --half-ink:#241B00;
  --low:#F08A3C; --low-ink:#2A1100; --out:#F06B60; --out-ink:#2A0603; --flag:#F2BE4A; --warn-bg:#3A2E14; --warn-ink:#F5D79A;
  --ok:#45B86A; --danger:#F06B60; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.35;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:10px;padding-block:10px 8px}
.title{flex:1;min-width:0;font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.02em;text-transform:uppercase;line-height:1.05}
.title small{display:block;font-family:var(--f-body);font-weight:600;font-size:12px;letter-spacing:.06em;color:var(--muted)}
.seg{display:flex;flex:1;min-width:0;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{flex:1;min-height:42px;border:0;background:transparent;border-radius:999px;font-weight:700;font-size:17px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.sync{flex:none;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;min-height:42px;padding:0 11px;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--ok)} .dot.wait{background:var(--half)} .dot.off{background:var(--out)}
.search{position:relative;padding-block:0 8px}
.search input{width:100%;min-height:52px;border:2px solid var(--line);background:var(--surface-2);border-radius:12px;padding:0 48px 0 14px;font-size:18px}
.search input:focus{border-color:var(--accent);outline:none}
.search .clr{position:absolute;right:4px;top:4px;width:44px;height:44px;border:0;background:transparent;font-size:24px;color:var(--muted);border-radius:10px}
.rail{display:flex;gap:6px;overflow-x:auto;padding-block:0 10px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:38px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:0 13px;font-weight:600;font-size:15px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent-bg);border-color:var(--accent)}
.chip .c{color:var(--muted);font-weight:500;margin-left:4px;font-size:13px;font-variant-numeric:tabular-nums}

main{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 90px)}
.banner{margin-top:12px;background:var(--warn-bg);color:var(--warn-ink);border-radius:var(--r);padding:10px 12px;font-size:14px;font-weight:500;display:flex;flex-direction:column;gap:8px}
.banner .btnrow{gap:6px}
.summary{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-block:10px 6px;color:var(--muted);font-size:14px;min-height:44px}
.ghead{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:14px 2px 6px}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row.open{background:var(--surface-2)}
.rbtn{display:flex;align-items:center;gap:10px;width:100%;min-height:56px;border:0;background:transparent;text-align:left;padding:8px 12px}
.size{flex:none;font-family:var(--f-mono);font-weight:600;font-size:14px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:3px 6px;line-height:1.2;white-space:nowrap}
.row.open .size{background:var(--surface)}
.nm{flex:1;min-width:0;font-weight:600;font-size:16.5px;line-height:1.25}
.nm .cat{display:block;font-weight:500;font-size:13px;color:var(--muted)}
.right{flex:none;display:flex;align-items:center;gap:6px}
.flg{color:var(--flag);font-size:18px;line-height:1}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:3px 10px;font-size:13.5px;font-weight:700;white-space:nowrap;min-width:64px;justify-content:center}
.pill.Extra{background:var(--extra);color:var(--extra-ink)} .pill.Stocked{background:var(--stocked);color:var(--stocked-ink)} .pill.Half{background:var(--half);color:var(--half-ink)}
.pill.Low{background:var(--low);color:var(--low-ink)} .pill.Out{background:var(--out);color:var(--out-ink)} .pill.None{border:1.5px dashed var(--muted);color:var(--muted);padding:2px 9px}
.pill.Hidden{background:transparent;border:1.5px solid var(--line);color:var(--muted)}
.selbox{flex:none;width:26px;height:26px;accent-color:var(--accent);pointer-events:none}
.acts{padding:0 12px 12px;display:flex;flex-direction:column;gap:8px}
.lvls{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.lv{min-height:50px;border:1.5px solid var(--line);background:var(--surface);border-radius:9px;font-weight:700;font-size:14.5px;color:var(--ink);padding:0 2px}
.lv[data-lv="Extra"][aria-pressed="true"]{background:var(--extra);border-color:var(--extra);color:var(--extra-ink)}
.lv[data-lv="Stocked"][aria-pressed="true"]{background:var(--stocked);border-color:var(--stocked);color:var(--stocked-ink)}
.lv[data-lv="Half"][aria-pressed="true"]{background:var(--half);border-color:var(--half);color:var(--half-ink)}
.lv[data-lv="Low"][aria-pressed="true"]{background:var(--low);border-color:var(--low);color:var(--low-ink)}
.lv[data-lv="Out"][aria-pressed="true"]{background:var(--out);border-color:var(--out);color:var(--out-ink)}
.minor{display:flex;gap:6px;flex-wrap:wrap}
.minor .btn{flex:1}
.btn{min-height:44px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:0 14px;font-weight:700;font-size:15px}
.btn.sm{min-height:40px;padding:0 11px;font-size:14px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.go{background:var(--stocked);border-color:var(--stocked);color:var(--stocked-ink)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:var(--surface)}
.btn.ghost{background:transparent}
.btn[aria-pressed="true"]{background:var(--accent-bg);border-color:var(--accent)}
.btn:disabled{opacity:.5}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.addbig{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;margin-top:12px;border:2px dashed var(--accent);background:var(--surface);border-radius:12px;font-weight:700;font-size:16px;color:var(--ink);padding:8px 14px;text-align:center}
.addbig .plus{flex:none;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:22px;line-height:1}
.hidmatch{margin-top:10px;width:100%;min-height:44px;border:1px solid var(--line);background:transparent;border-radius:var(--r);color:var(--muted);font-weight:600;font-size:14px}
.more{padding:18px;text-align:center;color:var(--muted)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:22px 16px;text-align:center;color:var(--muted);margin-top:12px;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty h3{margin:0;color:var(--ink);font-family:var(--f-display);font-size:22px;text-transform:uppercase;letter-spacing:.03em}
.empty p{margin:0;max-width:42ch}

.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:12px;display:flex;flex-direction:column;gap:10px}
.sec h2{margin:0;font-family:var(--f-display);font-size:20px;text-transform:uppercase;letter-spacing:.04em}
.sec p{margin:0;color:var(--muted);font-size:14.5px;max-width:65ch}
.sec ol{margin:0;padding-left:20px;color:var(--muted);font-size:14.5px;display:flex;flex-direction:column;gap:4px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14.5px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600}
.conf{border:1px solid var(--line);border-left:4px solid var(--half);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;font-size:14.5px}
.upd{font-size:12.5px;color:var(--muted)}
.req{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px}
.req .k{font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.req .k.low{color:var(--low)} .req .k.need{color:var(--extra)} .req .k.other{color:var(--muted)}
.req .txt{font-size:16px}
.req .item{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.req.closed{opacity:.7}
.stat{font-size:12.5px;font-weight:700;border-radius:999px;padding:2px 8px;border:1px solid var(--line)}
.stat.open{border-color:var(--half)} .stat.done{border-color:var(--ok);color:var(--ok)}
.reqlist{display:flex;flex-direction:column;gap:8px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs button{flex:1;min-height:var(--nav-h);border:0;background:transparent;font-family:var(--f-display);font-weight:700;font-size:16px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);position:relative;padding:0 2px}
nav.tabs button[aria-current="page"]{color:var(--ink);box-shadow:inset 0 3px 0 var(--accent)}
nav.tabs .lb{position:relative;display:inline-block}
nav.tabs .badge{position:absolute;top:-11px;right:-15px;background:var(--out);color:var(--out-ink);font-family:var(--f-body);font-size:11.5px;border-radius:999px;min-width:19px;height:19px;display:inline-grid;place-items:center;padding:0 5px;letter-spacing:0}
.selbar{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));z-index:21;background:var(--ink);color:var(--surface);display:flex;gap:6px;align-items:center;padding-block:10px;flex-wrap:wrap}
.selbar .t{flex:1;font-weight:700;min-width:90px}
.selbar .btn{background:transparent;color:var(--surface);border-color:currentColor}
.selbar .btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding-block:14px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;overscroll-behavior:contain}
.sheet h2{margin:0;font-family:var(--f-display);font-size:24px;text-transform:uppercase;letter-spacing:.03em}
.sheet .hd{display:flex;align-items:center;justify-content:space-between;gap:8px}
.x{flex:none;width:44px;height:44px;border:0;background:var(--surface-2);border-radius:50%;font-size:22px}
.field{display:flex;flex-direction:column;gap:5px}
.field > label,.field > .lab{font-weight:600;font-size:14px}
.field input,.field select,.field textarea{min-height:48px;border:1px solid var(--line);background:var(--surface-2);border-radius:var(--r);padding:8px 10px;font-size:16.5px;width:100%}
.field textarea{min-height:84px;resize:vertical}
.hint{font-size:12.5px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips .chip{min-height:36px;font-family:var(--f-mono);font-size:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two > *{min-width:0}
.err{color:var(--danger);font-weight:600;font-size:14px}
.stick{position:sticky;bottom:calc(-16px - env(safe-area-inset-bottom,0px));background:var(--surface);padding-block:8px calc(16px + env(safe-area-inset-bottom,0px));margin-bottom:calc(-16px - env(safe-area-inset-bottom,0px))}
.linkbtn{border:0;background:transparent;color:var(--accent);font-weight:700;text-decoration:underline;padding:4px 0;min-height:36px;text-align:left}

.start{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;justify-content:center;gap:14px;padding-block:24px}
.start h1{margin:0 0 6px;font-family:var(--f-display);font-size:34px;line-height:1;text-transform:uppercase;letter-spacing:.02em}
.start p{margin:0;color:var(--muted)}
.big{display:flex;flex-direction:column;align-items:flex-start;gap:4px;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:20px 18px;min-height:116px}
.big .t{font-family:var(--f-display);font-weight:700;font-size:32px;text-transform:uppercase;letter-spacing:.02em}
.big .s{color:var(--muted);font-size:15px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 14px);z-index:60;background:var(--ink);color:var(--surface);border-radius:999px;padding:10px 16px;font-weight:600;font-size:14.5px;width:max-content;max-width:calc(100% - 32px);text-align:center;display:flex;gap:12px;align-items:center}
.toast button{border:0;background:transparent;color:var(--accent);font-weight:700;text-decoration:underline;min-height:32px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .16s ease-out}@keyframes up{from{transform:translateY(20px)}}}
@media (min-width:700px){ main,.top .inner{max-width:760px;margin-inline:auto} .scrim{align-items:center} .sheet{border-radius:16px;max-height:86%} .stick{position:static;margin:0;padding-bottom:0} }
@media (max-width:360px){ .lv{font-size:13px} nav.tabs button{font-size:14.5px} }
</style>

<header class="top"><div class="inner wrap">
  <div class="bar">
    <div class="seg" role="group" aria-label="Inventory" id="locSeg">
      <button id="locVan" type="button" aria-pressed="true">Van</button>
      <button id="locShop" type="button" aria-pressed="false">Shop</button>
    </div>
    <div class="title" id="viewerTitle" hidden>Shop inventory<small>ASR Plumbing · view only</small></div>
    <button class="sync" id="syncBtn" type="button" aria-label="Sync status"><span class="dot" id="syncDot"></span><span id="syncTxt">…</span></button>
  </div>
  <div id="searchHead">
    <div class="search"><input id="q" type="search" enterkeyhint="search" placeholder="Search: 1/2 pex 90, half inch tee…" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Search items"><button class="clr" id="qClr" type="button" aria-label="Clear search" hidden>×</button></div>
    <div class="rail" id="rail" aria-label="Categories"></div>
  </div>
</div></header>

<main class="wrap" id="main">
  <section id="vStock"></section>
  <section id="vRefill" hidden></section>
  <section id="vReq" hidden></section>
  <section id="vMore" hidden></section>
</main>

<div class="selbar wrap" id="selbar" hidden>
  <span class="t" id="selN">0 selected</span>
  <button class="btn sm" id="selAll" type="button">All shown</button>
  <button class="btn sm" id="selLevel" type="button">Set level</button>
  <button class="btn sm pri" id="selMain" type="button">Hide</button>
  <button class="btn sm" id="selDone" type="button">Done</button>
</div>

<nav class="tabs" aria-label="Sections" id="tabs"></nav>

<div id="startScreen" class="start wrap" hidden>
  <div><h1>Plumbing Inventory</h1><p>Pick an inventory. You can switch any time from the top bar.</p></div>
  <button class="big" type="button" data-start="van"><span class="t">Van</span><span class="s" id="stVan"></span></button>
  <button class="big" type="button" data-start="shop"><span class="t">Shop</span><span class="s" id="stShop"></span></button>
</div>

function rebuild(){
  if(S.mode!=="local"){
    for(const c of COLS){
      const m=new Map();for(const [id,d] of S.remote[c])m.set(id,d);
      for(const q of S.queue){const [qc,qid]=q.path.split("/");if(qc!==c)continue;
        if(q.op==="del")m.delete(qid);else if(q.op==="set")m.set(qid,deepMerge({},q.data));else m.set(qid,deepMerge(m.get(qid)||{},q.data))}
      S.docs[c]=m;
    }
  }
  S.itemsCache={};
}
function items(loc){
  if(S.itemsCache[loc])return S.itemsCache[loc];
  const out=new Map();
  for(const [docId,d] of S.docs[loc]){if(docId==="meta"||!d||!d.items)continue;
    for(const id in d.items){const it=d.items[id];if(!it)continue;
      if(it.gone){continue}
      out.set(id,{...it,id,doc:docId,cat:d.cat,cord:d.ord??99,loc});}}
  return S.itemsCache[loc]=[...out.values()];
}
const meta=loc=>S.docs[loc].get("meta")||{};
const visible=loc=>items(loc).filter(it=>!it.hidden);
const needs=it=>!it.hidden&&(NEED.has(it.lvl)||!!it.flag);
const groupOf=cat=>{for(const [g,cs] of GROUPS)if(cs.includes(cat))return g;return cat};
const byOrder=(a,b)=>a.cord-b.cord||cmpSize(a.size,b.size)||(a.ord??0)-(b.ord??0)||a.name.localeCompare(b.name);
const dispName=it=>{const n=it.name||"";return it.size&&n.startsWith(it.size+" ")?cap(n.slice(it.size.length+1)):n};
const itemKey=it=>norm(it.cat)+"|"+normSize(it.size||"")+"|"+norm(it.name);

/* ================= data: writes, queue, sync ================= */
function persistLocal(){for(const c of COLS)store.set("local."+c,Object.fromEntries(S.docs[c]))}
function queueWrite(path,data,op="update",base){
  const [c,id]=path.split("/");
  if(S.mode==="local"){
    if(op==="del")S.docs[c].delete(id);else if(op==="set")S.docs[c].set(id,deepMerge({},data));else S.docs[c].set(id,deepMerge(S.docs[c].get(id)||{},data));
    S.itemsCache={};persistLocal();return;
  }
  const last=S.queue[S.queue.length-1];
  if(op==="update"&&last&&last.path===path&&last.op!=="del"&&!last.inflight){last.data=deepMerge(last.data,data);last.base=deepMerge(base||{},last.base||{})}
  else S.queue.push({path,op,data,base:base||null,t:Date.now()});
  store.set("queue",S.queue);rebuild();updateSync();flush();
}
function writeItem(it,patch){
  if(!isOwner())return;
  const now=Date.now(),p={...patch};const base={};
  if(STOCK_F.some(f=>f in p)){p.sAt=now;p.sDev=DEV;base.s=it.sAt||0}
  if(DETAIL_F.some(f=>f in p)){p.dAt=now;p.dDev=DEV;base.d=it.dAt||0}
  queueWrite(`${it.loc}/${it.doc}`,{items:{[it.id]:p}},"update",{[it.id]:base});
}
function writeMany(loc,list,patchFn){ // list of items, grouped into one write per category doc
  const now=Date.now(),by=new Map();
  for(const it of list){const p=patchFn(it);if(!p)continue;const base={};
    if(STOCK_F.some(f=>f in p)){p.sAt=now;p.sDev=DEV;base.s=it.sAt||0}if(DETAIL_F.some(f=>f in p)){p.dAt=now;p.dDev=DEV;base.d=it.dAt||0}
    if(!by.has(it.doc))by.set(it.doc,{data:{items:{}},base:{}});const g=by.get(it.doc);g.data.items[it.id]=p;g.base[it.id]=base}
  for(const [doc,g] of by)queueWrite(`${loc}/${doc}`,g.data,"update",g.base);
}
let wake=null;const sleep=ms=>new Promise(r=>{const t=setTimeout(r,ms);wake=()=>{clearTimeout(t);r()}});
const pick=(o,fs)=>{const r={};for(const f of fs)if(o&&f in o)r[f]=o[f];return r};
const same=(a,b,fs)=>fs.every(f=>(a[f]??null)===(b[f]??null));
function checkConflicts(q,remote){
  const [loc]=q.path.split("/");if(loc!=="van"&&loc!=="shop"||!q.data.items||!remote||!remote.items)return q.data;
  const data=deepMerge({},q.data);
  for(const id in data.items){const mine=data.items[id],r=remote.items[id];if(!r)continue;
    for(const [g,fs,at,dv] of [["s",STOCK_F,"sAt","sDev"],["d",DETAIL_F,"dAt","dDev"]]){
      const mf=fs.filter(f=>f in mine);if(!mf.length)continue;
      const baseAt=q.base&&q.base[id]?q.base[id][g]:undefined;if(baseAt===undefined)continue;
      if((r[at]||0)===(baseAt||0)||r[dv]===DEV)continue;        // nobody else changed it since this phone last saw it
      if(same(mine,r,mf))continue;                               // both phones made the same change
      const theirs=pick(r,mf),mineV=pick(mine,mf),nm=(r.size?r.size+" ":"")+(r.name||id),myAt=mine[at]||q.t;
      if((r[at]||0)>myAt){for(const f of mf)delete mine[f];delete mine[at];delete mine[dv];
        addConflict({loc,doc:q.path.split("/")[1],id,name:nm,kept:theirs,keptAt:r[at],keptBy:"other",alt:mineV,altAt:myAt});}
      else addConflict({loc,doc:q.path.split("/")[1],id,name:nm,kept:mineV,keptAt:mine[at],keptBy:"this",alt:theirs,altAt:r[at]});
    }
    if(!Object.keys(mine).length)delete data.items[id];
  }
  return data;
}
function addConflict(c){c.cid=uid("c");c.t=Date.now();S.conflicts.unshift(c);S.conflicts=S.conflicts.slice(0,30);store.set("conflicts",S.conflicts);
  toast(`Two phones changed ${c.name}. Kept the newer one; check More.`);renderTabs()}
async function flush(){
  if(S.flushing||!S.db||!S.queue.length)return;
  S.flushing=true;
  try{
    while(S.queue.length&&S.db){
      const q=S.queue[0];q.inflight=true;const [c,id]=q.path.split("/");const ref=S.db.doc(q.path);
      try{
        let remote=S.remote[c].get(id);
        // read the server's current copy first, so a change made on another phone while this one was offline is never overwritten unnoticed
        if(q.op==="update"&&(!remote||c==="van"||c==="shop")){const g=await ref.get();if(g.exists){remote=g.data();S.remote[c].set(id,remote)}else remote=undefined}
        let data=q.op==="del"?null:(q.op==="update"?checkConflicts(q,remote):q.data);
        if(q.op==="del")await ref.delete();
        else if(q.op==="set"||!remote)await ref.set(q.op==="update"?deepMerge({},data):data);
        else if(data.items&&!Object.keys(data.items).length&&Object.keys(data).length===1){/* nothing left after conflict resolution */}
        else await ref.update(data);
        S.queue.shift();S.online=true;
        if(q.op==="del")S.remote[c].delete(id);else S.remote[c].set(id,q.op==="set"?deepMerge({},data):deepMerge(remote||{},data));
      }catch(e){
        q.inflight=false;const code=e&&e.code;
        if(code==="invalid_argument"||code==="transform_error"){S.queue.shift();
          if(c==="requests"){S.readOnly=true;toast("Your access is view-only, so the request couldn't be sent. Ask Jordan to give you Editor access.")}else toast("A change couldn't be saved: "+(e.message||code));continue}
        if(code==="quota_exceeded"){S.queue.shift();toast("Storage is full. Clear old requests in More.");continue}
        if(["revoked","not_granted","capability_disabled","capability_removed"].includes(code)){S.db=null;S.online=false;break}
        S.online=false;updateSync();await sleep(code==="resource_exhausted"?3000:5000);
      }finally{store.set("queue",S.queue)}
    }
  }finally{S.flushing=false;rebuild();updateSync();scheduleRender()}
}
setInterval(()=>{if(S.queue.length)flush()},12000);
addEventListener("online",()=>{S.online=true;updateSync();if(wake){wake();wake=null}flush()});addEventListener("offline",()=>{S.online=false;updateSync()});
let cacheT={};function cacheSoon(c){clearTimeout(cacheT[c]);cacheT[c]=setTimeout(()=>store.set("cache."+c,Object.fromEntries(S.remote[c])),1200)}

/* ================= boot ================= */
function seedLocal(){
  for(const loc of LOCS){const m=new Map();
    CAT.cats.forEach((cat,ci)=>m.set("c"+String(ci+1).padStart(2,"0"),{cat,ord:ci,items:{}}));
    CAT.items.forEach((r,i)=>{const d=m.get("c"+String(r[0]+1).padStart(2,"0"));d.items["s"+String(i+1).padStart(3,"0")]={name:r[2],size:r[1],cnote:r[3],mat:r[4],sch:r[5],nick:"",ord:i,hidden:false,lvl:null,flag:false}});
    m.set("meta",{setupDone:false});S.docs[loc]=m}
}
async function boot(){
  // show the last copy right away (works with no signal)
  if(store.get("wasShared",false)){S.mode="shared";for(const c of COLS){const ch=store.get("cache."+c,null);if(ch)S.remote[c]=new Map(Object.entries(ch))}rebuild()}
  renderAll();
  const c=window.claude;
  const [db,user]=await Promise.all([c?c.use("db").catch(()=>null):null,c?c.use("user").catch(()=>null):null]);
  S.user=user;
  if(db&&user){
    try{const o=await user.isOwner();S.role=o?"owner":"viewer";store.set("role",S.role)}catch(e){}
    try{S.uid=await user.id()}catch(e){}
    S.db=db;S.mode="shared";store.set("wasShared",true);
    const cols=isOwner()?COLS:["shop","requests"];
    for(const col of cols){
      db.collection(col).limit(1000).onSnapshot(snap=>{
        const m=new Map();for(const d of snap.docs)m.set(d.id,d.data());S.remote[col]=m;S.loadedCols.add(col);
        if(!snap.metadata.fromCache){S.lastSync=Date.now();S.online=true;store.set("lastSync",S.lastSync);cacheSoon(col)}
        rebuild();scheduleRender();flush();
      },err=>{S.online=false;updateSync()});
    }
  }else if(S.mode!=="shared"){
    S.mode="local";S.role="owner";
    let any=false;for(const col of COLS){const v=store.get("local."+col,null);if(v){S.docs[col]=new Map(Object.entries(v));any=true}}
    if(!any){seedLocal();persistLocal()}
    for(const col of COLS)S.loadedCols.add(col);
  }else{for(const col of COLS)if(S.remote[col].size)S.loadedCols.add(col)}
  if(!S.role)S.role="viewer";
  renderAll();
}

/* ================= rendering ================= */
let rq=0;function scheduleRender(){if(rq)return;rq=setTimeout(()=>{rq=0;renderAll()},16)}
function renderAll(){
  const own=isOwner(),loc=curLoc();
  $("#locSeg").hidden=!own;$("#viewerTitle").hidden=own;
  $("#locVan").setAttribute("aria-pressed",loc==="van");$("#locShop").setAttribute("aria-pressed",loc==="shop");
  if(!own&&!["stock","req"].includes(S.tab))S.tab="stock";
  for(const [k,el] of [["stock","#vStock"],["refill","#vRefill"],["req","#vReq"],["more","#vMore"]])$(el).hidden=S.tab!==k;
  $("#searchHead").hidden=S.tab!=="stock";
  if(S.tab==="more"&&S.conflicts.some(c=>!c.seen)){S.conflicts.forEach(c=>c.seen=true);store.set("conflicts",S.conflicts)}
  renderTabs();updateSync();
  if(S.tab==="stock")renderStock();else if(S.tab==="refill")renderRefill();else if(S.tab==="req")renderReq();else renderMore();
  renderStart();renderSelbar(false);
}
function renderTabs(){
  const own=isOwner(),loc=curLoc();
  const refillN=own?visible(loc).filter(needs).length:0;
  const openReq=[...S.docs.requests.values()].filter(r=>r&&r.status==="open").length;
  const tabs=own?[["stock","Stock"],["refill","Refill",refillN],["req","Requests",openReq],["more","More",S.conflicts.filter(c=>!c.seen).length]]:[["stock","Shop"],["req","Request"]];
  $("#tabs").innerHTML=tabs.map(([k,l,n])=>`<button type="button" data-tab="${k}" ${S.tab===k?'aria-current="page"':""}><span class="lb">${l}${n?`<span class="badge">${n}</span>`:""}</span></button>`).join("");
}
function updateSync(){
  const d=$("#syncDot"),t=$("#syncTxt");let cls="",txt="";
  if(S.mode==="local")txt="This phone";
  else if(S.mode==="loading")txt="…";
  else if(S.queue.length){cls=S.db&&S.online?"wait":"off";txt=S.db&&S.online?"Saving":"Offline · "+S.queue.length}
  else if(S.db&&S.online&&navigator.onLine){cls="ok";txt="Synced"}
  else{cls="off";txt="Offline"}
  d.className="dot "+cls;t.textContent=txt;
}
function pillHTML(it){
  if(it.hidden)return`<span class="pill Hidden">Hidden</span>`;
  return`<span class="pill ${it.lvl||"None"}">${it.lvl||"Not set"}</span>`;
}
function rowHTML(it,opts={}){
  const open=S.open===it.loc+":"+it.id&&!S.select;const own=isOwner();
  const sel=S.select?`<input type="checkbox" class="selbox" tabindex="-1" aria-hidden="true" ${S.select.has(it.id)?"checked":""}>`:"";
  let acts="";
  if(open){
    if(it.hidden&&own)acts=`<div class="acts"><p class="upd" style="margin:0">Hidden from ${LOCNAME[it.loc]}. Restore it to track it again.</p><div class="minor"><button class="btn pri" type="button" data-act="unhide">Restore to ${LOCNAME[it.loc]}</button><button class="btn" type="button" data-act="edit">Edit</button></div></div>`;
    else if(own)acts=`<div class="acts"><div class="lvls" role="group" aria-label="${LOCNAME[it.loc]} stock level">${LEVELS.map(l=>`<button class="lv" type="button" data-lv="${l}" aria-pressed="${it.lvl===l}">${l}</button>`).join("")}</div>
      <div class="minor"><button class="btn sm" type="button" data-act="flag" aria-pressed="${!!it.flag}">${it.flag?"⚑ Flagged":"⚑ Flag for refill"}</button><button class="btn sm" type="button" data-act="hide">Hide</button><button class="btn sm" type="button" data-act="edit">Edit</button></div>
      ${it.sAt&&S.mode!=="local"?`<span class="upd">Updated ${ago(it.sAt)}${it.sDev===DEV?" on this phone":""}</span>`:""}</div>`;
    else acts=`<div class="acts"><div class="minor"><button class="btn sm" type="button" data-act="reqLow" ${S.readOnly?"disabled":""}>Report low</button><button class="btn sm" type="button" data-act="reqNeed" ${S.readOnly?"disabled":""}>Request this</button></div></div>`;
  }

    <span class="nm">${esc(dispName(it))}${showCat?`<span class="cat">${esc(it.cat)}</span>`:""}</span><span class="right">${it.flag&&!it.hidden?`<span class="flg" aria-label="flagged">⚑</span>`:""}${pillHTML(it)}</span></button>${acts}</div>`;

function renderRail(loc){
  const base=S.hiddenView?items(loc).filter(i=>i.hidden):visible(loc);const cnt=new Map();
  for(const it of base){const g=groupOf(it.cat);cnt.set(g,(cnt.get(g)||0)+1)}
  const order=GROUPS.map(g=>g[0]).concat([...cnt.keys()].filter(g=>!GROUPS.some(x=>x[0]===g)).sort());
  $("#rail").innerHTML=`<button class="chip" type="button" data-g="" aria-pressed="${!S.group}">All<span class="c">${base.length}</span></button>`+
    order.filter(g=>cnt.has(g)).map(g=>`<button class="chip" type="button" data-g="${esc(g)}" aria-pressed="${S.group===g}">${esc(g)}<span class="c">${cnt.get(g)}</span></button>`).join("");
}
let io;
function renderStock(){
  const V=$("#vStock"),loc=curLoc(),own=isOwner();renderRail(loc);
  if(!S.loadedCols.has(loc)&&!items(loc).length){V.innerHTML=`<div class="empty"><h3>Loading</h3><p>Getting the ${LOCNAME[loc].toLowerCase()} inventory…</p></div>`;return}
  let html="";
  const m=meta(loc),all=items(loc);
  if(own&&!S.hiddenView&&all.length&&!m.setupDone){
    const counted=all.filter(i=>!i.hidden&&i.lvl).length,blank=all.filter(i=>!i.hidden&&!i.lvl).length;
    html+=`<div class="banner"><span><b>Setting up ${LOCNAME[loc]}:</b> ${counted} of ${counted+blank} set. When you finish, the ${blank} items still blank get hidden from ${LOCNAME[loc]} (not deleted).</span>
      <div class="btnrow"><button class="btn sm pri" type="button" data-act="finishSetup">Finish setup</button><button class="btn sm" type="button" data-act="bulk">Select several</button></div></div>`;
  }
  if(S.hiddenView)html+=`<div class="banner"><span><b>Hidden from ${LOCNAME[loc]}.</b> These aren't tracked or shown in the normal list. Restore any you want back.</span><div class="btnrow"><button class="btn sm" type="button" data-act="bulk">Select several</button><button class="btn sm" type="button" data-act="exitHidden">Back to ${LOCNAME[loc]}</button></div></div>`;
  if(!own&&S.mode==="shared"&&!all.length)html+=`<div class="empty"><h3>Nothing here yet</h3><p>The shop inventory hasn't been set up.</p></div>`;
  const toks=tokenize(S.q);
  const inGroup=it=>!S.group||groupOf(it.cat)===S.group;
  const pool=S.hiddenView?all.filter(i=>i.hidden):all.filter(i=>!i.hidden);
  let res=pool.filter(inGroup).map(it=>[it,toks.length?score(it,toks):0]).filter(x=>x[1]>=0);
  if(toks.length)res.sort((a,b)=>b[1]-a[1]||byOrder(a[0],b[0]));else res.sort((a,b)=>byOrder(a[0],b[0]));
  const arr=res.map(x=>x[0]);
  const hidMatch=(own&&!S.hiddenView&&toks.length)?all.filter(i=>i.hidden&&inGroup(i)&&score(i,toks)>=0):[];
  html+=`<div class="summary"><span>${toks.length?`${arr.length} match${arr.length===1?"":"es"}`:`${arr.length} item${arr.length===1?"":"s"}`}${S.group?" in "+esc(S.group):""} · ${LOCNAME[loc]}</span>
    ${own&&arr.length?`<button class="btn sm ghost" type="button" data-act="bulk">${S.select?"Selecting…":"Select"}</button>`:""}</div>`;
  if(arr.length){
    const slice=arr.slice(0,S.shown);
    if(toks.length||S.hiddenView){html+=`<div class="list">${slice.map(it=>rowHTML(it,{showCat:true})).join("")}</div>`}
    else{let g=null;for(const it of slice){if(it.cat!==g){if(g!==null)html+=`</div>`;g=it.cat;html+=`<div class="ghead">${esc(g)}</div><div class="list">`}html+=rowHTML(it)}html+=`</div>`}
    if(arr.length>S.shown)html+=`<div class="more" id="sentinel">Showing ${S.shown} of ${arr.length}…</div>`;
  }else if(toks.length||S.group){html+=`<div class="empty"><p>No ${S.hiddenView?"hidden ":""}items match${S.q?` “${esc(S.q)}”`:""}${S.group?` in ${esc(S.group)}`:""}.</p></div>`}
  if(hidMatch.length){
    if(S.showHidden)html+=`<div class="ghead">Hidden from ${LOCNAME[loc]} (${hidMatch.length})</div><div class="list">${hidMatch.slice(0,40).map(it=>rowHTML(it,{showCat:true})).join("")}</div>`;
    else html+=`<button class="hidmatch" type="button" data-act="showHidden">${hidMatch.length} hidden item${hidMatch.length===1?"":"s"} also match · Show</button>`;
  }
  if(!S.hiddenView){
    const label=S.q.trim()?`Add “${esc(S.q.trim())}” to ${LOCNAME[loc]}`:`Add an item to ${LOCNAME[loc]}`;
    if(own)html+=`<button class="addbig" type="button" data-act="add"><span class="plus" aria-hidden="true">+</span><span>${label}</span></button>`;
    else html+=`<button class="addbig" type="button" data-act="reqFree" ${S.readOnly?"disabled":""}><span class="plus" aria-hidden="true">+</span><span>${S.q.trim()?`Request “${esc(S.q.trim())}”`:"Request something not listed"}</span></button>`;
  }
  V.innerHTML=html;

}

function catOptions(loc,sel){const cats=[...S.docs[loc]].filter(([id,d])=>id!=="meta"&&d&&d.cat).sort((a,b)=>(a[1].ord??99)-(b[1].ord??99)).map(x=>x[1].cat);
  const list=[...new Set(cats.concat(CAT.cats))];return list.map(c=>`<option ${c===sel?"selected":""}>${esc(c)}</option>`).join("")+`<option value="__new">New category…</option>`}
function docForCat(loc,cat){for(const [id,d] of S.docs[loc])if(id!=="meta"&&d&&d.cat===cat)return id;return null}
function addItems(loc,list){ // list of {name,size,cat,lvl}; returns {added,dups}
  const have=new Map(items(loc).map(i=>[itemKey(i),i]));const added=[],dups=[];let ord=Math.max(0,...items(loc).map(i=>i.ord||0));
  const byDoc=new Map(),newDocs=new Map();const now=Date.now();
  for(const x of list){const k=itemKey(x);if(have.has(k)){dups.push(have.get(k));continue}have.set(k,x);
    let doc=docForCat(loc,x.cat)||[...newDocs].find(([id,c])=>c===x.cat)?.[0];
    if(!doc){doc="x"+Math.abs([...x.cat].reduce((h,c)=>(h*31+c.charCodeAt(0))|0,7)).toString(36);newDocs.set(doc,x.cat)}
    const id=uid("u");const it={name:x.name,size:x.size||"",nick:"",mat:"",sch:"",cnote:"",ord:++ord,hidden:false,lvl:x.lvl||null,flag:false,dAt:now,dDev:DEV,sAt:now,sDev:DEV,created:now};
    if(!byDoc.has(doc))byDoc.set(doc,{});byDoc.get(doc)[id]=it;added.push({...it,id,doc,cat:x.cat,loc})}
  for(const [doc,its] of byDoc){if(newDocs.has(doc)&&!S.docs[loc].has(doc))queueWrite(`${loc}/${doc}`,{cat:newDocs.get(doc),ord:50+S.docs[loc].size,items:its},"set");else queueWrite(`${loc}/${doc}`,{items:its},"update",{})}
  return{added,dups};
}

  const b=e.target.closest("button");if(!b)return;const act=b.dataset.act;const row=b.closest(".row");
  const it=row?findItem(row.dataset.loc,row.dataset.id):null;
  if(it&&S.select&&act==="toggle"){S.select.has(it.id)?S.select.delete(it.id):S.select.add(it.id);row.outerHTML=rowHTML(it,{showCat:!!S.q||S.hiddenView});renderSelbar();return}
  if(it&&b.dataset.lv){writeItem(it,{lvl:b.dataset.lv});S.rSticky=S.rSticky||new Set();S.rSticky.add(it.id);
    if(S.tab==="refill"||S.tab==="req")scheduleRender();else{const n=findItem(it.loc,it.id);row.outerHTML=rowHTML(n,{showCat:!!S.q});renderTabs()}return}
  switch(act){
    case "toggle":{const key=it.loc+":"+it.id;S.open=S.open===key?null:key;const wasReq=S.tab==="req";if(wasReq||S.tab==="refill")scheduleRender();else row.outerHTML=rowHTML(it,{showCat:!!S.q||S.hiddenView});return}
    case "flag":writeItem(it,{flag:!it.flag});S.rSticky=S.rSticky||new Set();S.rSticky.add(it.id);scheduleRender();return;
    case "hide":hideItems([it],true);return;
    case "unhide":hideItems([it],false);return;
    case "edit":editSheet(it);return;
    case "reqLow":requestSheet("low",it);return;
    case "reqNeed":requestSheet("need",it);return;
    case "reqFree":requestSheet("need",null,S.q.trim());return;
    case "add":addSheet(S.q);return;
    case "showHidden":S.showHidden=true;renderStock();return;
    case "bulk":S.select=new Set();S.open=null;S.tab="stock";renderAll();return;
    case "finishSetup":finishSetup();return;
    case "openHidden":S.hiddenView=true;S.tab="stock";S.select=null;S.group=null;renderAll();scrollTo(0,0);return;
    case "exitHidden":S.hiddenView=false;S.select=null;renderAll();return;
    case "flush":flush();return;
    case "useAlt":case "okConf":{const cid=b.closest(".conf").dataset.cid;const c=S.conflicts.find(x=>x.cid===cid);
      if(act==="useAlt"&&c){const cur=findItem(c.loc,c.id);if(cur)writeItem(cur,{...c.alt});toast("Switched to the other value")}
      S.conflicts=S.conflicts.filter(x=>x.cid!==cid);store.set("conflicts",S.conflicts);scheduleRender();return}
    case "reqDone":case "reqDismiss":{const rid=b.closest(".req").dataset.rid;queueWrite(`requests/${rid}`,{status:act==="reqDone"?"done":"dismissed",closedAt:Date.now()});scheduleRender();return}
    case "reqClear":{const closed=reqList().filter(r=>r.status!=="open");confirmSheet("Clear closed requests?",`${closed.length} closed request${closed.length===1?"":"s"} will be removed for everyone.`,"Clear",()=>{for(const r of closed)queueWrite(`requests/${r._id}`,null,"del");scheduleRender()});return}
  }
}
$("#main").addEventListener("click",onMainClick);
$("#selDone").onclick=()=>{S.select=null;renderAll()};
$("#selAll").onclick=()=>{document.querySelectorAll("#vStock .row").forEach(r=>S.select.add(r.dataset.id));renderStock();renderSelbar()};
$("#selMain").onclick=()=>{const loc=curLoc();const list=items(loc).filter(i=>S.select.has(i.id));if(!list.length)return toast("Tap items to select them.");
  if(S.hiddenView)hideItems(list,false);else confirmSheet(`Hide ${list.length} item${list.length===1?"":"s"}?`,`They'll leave the ${LOCNAME[loc].toLowerCase()} list and refill list but stay findable in search and in More → Hidden items.`,`Hide ${list.length}`,()=>hideItems(list,true))};
$("#selLevel").onclick=()=>{const loc=curLoc();const list=items(loc).filter(i=>S.select.has(i.id));if(!list.length)return toast("Tap items to select them.");
  levelPicker(l=>{writeMany(loc,list,()=>({lvl:l}));S.select=null;toast(`Set ${list.length} item${list.length===1?"":"s"} to ${l}`);scheduleRender()})};

boot();
</script>

</body></html>
